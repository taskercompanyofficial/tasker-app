name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Format to build'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  build:
    name: Build Android (${{ inputs.build_type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Environment Variables
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_BACKEND_URL=https://api.taskercompany.cloud
          EXPO_PUBLIC_STORAGE_URL=https://api.taskercompany.cloud/storage
          GOOGLE_MAPS_ANDROID_API_KEY=AIzaSyCIVVHDThwQ_aCBr_EAw_LpmA7U6vd4UUo
          GOOGLE_MAPS_IOS_API_KEY=AIzaSyCIVVHDThwQ_aCBr_EAw_LpmA7U6vd4UUo
          EOF

      - name: Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        if: inputs.build_type == 'apk' || inputs.build_type == 'both'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Build Release AAB (Google Play)
        if: inputs.build_type == 'aab' || inputs.build_type == 'both'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -x lint -x test

      - name: Upload APK
        if: inputs.build_type == 'apk' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: tasker-app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload AAB
        if: inputs.build_type == 'aab' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: tasker-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
